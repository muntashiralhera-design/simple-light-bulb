<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Light Bulb</title>
  <style>
    body{
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #222;
      font-family: sans-serif;
    }
    .bulb {
      width: 150px;
      height: 150px;
      background-color: #444;
      border-radius: 50px;
      margin-bottom: 40px;
      transition: all 0.3s ease;
      box-shadow: 0 0 0px transparent;
    }
    .bulb.on {
      background-color: #ffdf00;
      box-shadow: 0 0 50px #ffdf00, 0 0 100px #ffdf00;
    }
    .buttons {
      display: flex;
      gap: 40px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border:none;
      border-radius: 5px;
      font-weight: bold;
    }
    .on-btn {
      background-color: #28a745; color: white; 
    }
    .off-btn {
      background-color: #dc3545; color: white;
    }
    
  </style>
</head>
<body>
  <div class="bulb" id="lightBulb"></div>
  <div class="buttons">
    <button class="on-btn" onclick="turnOn()">ON</button>
   <button class="off-btn" onclick="turnOf()">OFF</button>
  </div>
  <script>
    const bulb = document.getElementById('lightBulb');
    
    function turnOn() {
      bulb.classList.add('on');
   }

   function turnOf() {
      bulb.classList.remove('on');
    }
    
  </script>
</body>
</html>
